name: PR 流程自动化

on:
  pull_request:
    branches: [main, master, develop]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-auto-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MAX_LINES: 800
  MAX_FILES: 30

jobs:
  pr-checks:
    name: PR 质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: PR 描述非空检查
        uses: actions/github-script@v7
        env:
          BODY: ${{ github.event.pull_request.body }}
        with:
          script: |
            const body = process.env.BODY || '';
            if (!body.trim() || body.trim().length < 20) {
              core.setFailed('PR 描述过短或为空，请填写变更说明和检查清单。');
            }

      - name: PR 大小检查
        uses: actions/github-script@v7
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          MAX_LINES: ${{ env.MAX_LINES }}
          MAX_FILES: ${{ env.MAX_FILES }}
        with:
          script: |
            const additions = parseInt(process.env.ADDITIONS, 10);
            const deletions = parseInt(process.env.DELETIONS, 10);
            const files = parseInt(process.env.CHANGED_FILES, 10);
            const maxLines = parseInt(process.env.MAX_LINES, 10);
            const maxFiles = parseInt(process.env.MAX_FILES, 10);
            const total = additions + deletions;

            const msgs = [];
            if (total > maxLines) {
              msgs.push(`⚠️ 本次 PR 变更行数 **${total}** 行，建议拆分为多个小 PR（建议不超过 ${maxLines} 行）。`);
            }
            if (files > maxFiles) {
              msgs.push(`⚠️ 本次 PR 涉及 **${files}** 个文件，建议拆分（建议不超过 ${maxFiles} 个文件）。`);
            }
            if (msgs.length) {
              const body = msgs.join('\n\n') + '\n\n> 若确实无法拆分，请在本条评论下方回复说明原因。';
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: 自动打标签
        uses: actions/github-script@v7
        env:
          CHANGED_FILES_JSON: ${{ toJson(github.event.pull_request.changed_files) }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            // 通过 API 获取变更文件列表
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const labels = new Set();
            for (const f of files) {
              const p = f.filename;
              if (p.startsWith('.github/')) labels.add('ci');
              if (p.startsWith('docs/') || p.endsWith('.md')) labels.add('docs');
              if (p.startsWith('aliyun_mcp/tools/')) labels.add('tools');
              if (p.startsWith('aliyun_mcp/config/') || p.startsWith('aliyun_mcp/core/')) labels.add('core');
              if (p === 'pyproject.toml' || p === 'requirements.txt') labels.add('deps');
              if (p.endsWith('.py')) labels.add('python');
            }

            if (labels.size) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: Array.from(labels),
              });
              console.log('已打标签:', Array.from(labels).join(', '));
            }




